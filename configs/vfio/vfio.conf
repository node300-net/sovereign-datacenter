# /etc/modprobe.d/vfio.conf
# PCI-IDs der GPU (VGA-Funktion + HDMI-Audio-Funktion) an vfio-pci binden.
# IDs ermitteln:  lspci -nn | grep -i nvidia
#
# ⚠️ PLATZHALTER – IDs IMMER mit lspci -nn verifizieren! Typische Werte (ohne Gewähr):
#   GTX 1080 Ti : 10de:1b06 (VGA), 10de:10ef (Audio)
#   RTX 3070 Ti : 10de:2482 (VGA), 10de:228b (Audio)
options vfio-pci ids=<<GPU_VGA_VENDOR:DEVICE>>,<<GPU_AUDIO_VENDOR:DEVICE>> disable_vga=1

# vfio-pci vor den GPU-Treibern laden
softdep nouveau pre: vfio-pci
softdep nvidia pre: vfio-pci
softdep snd_hda_intel pre: vfio-pci
