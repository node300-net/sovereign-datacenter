# /etc/modprobe.d/blacklist-gpu.conf
# Verhindert, dass der Host die Passthrough-GPU mit eigenen Treibern belegt.
# ⚠️ Nur auf Nodes mit GPU-Passthrough (NODE 0, NODE 2). Der Host nutzt dann die Onboard-VGA (BMC/ASPEED/Matrox).
blacklist nouveau
blacklist nvidia
blacklist nvidia_drm
blacklist nvidia_modeset
blacklist nvidiafb
blacklist rivafb
# snd_hda_intel NICHT pauschal blacklisten – stattdessen GPU-Audio-Funktion per ID an vfio-pci binden (vfio.conf).
