# /etc/pve/sdn/vnets.cfg  –  BEISPIEL
# VNet-Namen: max. 8 Zeichen. Tags entsprechen dem VLAN-Plan in docs/architecture.md

vnet: vdmz50
	zone dmz
	tag 50
	alias Honeypot-DMZ

vnet: vlab60
	zone lab
	tag 60
	alias RedTeam-Lab-isoliert

vnet: vana80
	zone lab
	tag 80
	alias Analytics

vnet: vxadlab
	zone ovl
	tag 100060
	alias AD-Forest-Overlay

vnet: vevpn1
	zone evpnz
	tag 11000
	alias EVPN-Tenant-1
