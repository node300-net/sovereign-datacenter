# /etc/pve/sdn/zones.cfg  –  BEISPIEL (Proxmox VE SDN)
# ⚠️ Nicht direkt nach /etc/pve kopieren, ohne Platzhalter zu prüfen.
#    Nach Änderungen: GUI "Datacenter → SDN → Apply" oder `pvesh set /cluster/sdn`.
# Zone-IDs: max. 8 Zeichen, alphanumerisch.

vlan: lab
	bridge vmbr0
	ipam pve
	mtu 1500

vlan: dmz
	bridge vmbr0
	ipam pve

# Overlay über das Storage-/10G-Netz (VLAN 40) – L2 über Node-Grenzen ohne Switch-Konfig
vxlan: ovl
	peers 10.10.40.10,10.10.40.11,10.10.40.12,10.10.40.13
	mtu 1450
	ipam pve

# Fortgeschritten: EVPN (benötigt Paket frr-pythontools + Controller in controllers.cfg)
evpn: evpnz
	controller evpnctl
	vrf-vxlan 10000
	exitnodes pve-n0-seccore
	mtu 1450
	ipam pve
